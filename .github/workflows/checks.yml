# This file holds what only GitHub reads: when the workflow runs, what it may touch,
# which jobs exist and how they depend on each other, and the actions it pins. Every
# decision is made by the program under src/, which each job fetches at this file's
# own commit and runs with one line.
name: Checks

on:
    pull_request:
    workflow_call:

permissions:
    contents: read

concurrency:
    group: checks-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    PROGRAM: .nextnode-checks

jobs:
    discover:
        name: Discover
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        outputs:
            node: ${{ steps.discover.outputs.node }}
            executor: ${{ steps.discover.outputs.executor }}
            checks: ${{ steps.discover.outputs.checks }}
            build: ${{ steps.discover.outputs.build }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0
                  filter: blob:none
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: ${{ job.workflow_repository }}
                  ref: ${{ job.workflow_sha }}
                  path: ${{ env.PROGRAM }}
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: ${{ env.PROGRAM }}/.node-version
            - id: discover
              run: node "$PROGRAM/src/cli.ts" discover

    check:
        name: ${{ matrix.name }}
        needs: discover
        if: needs.discover.outputs.checks != '[]'
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.discover.outputs.checks) }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: ${{ job.workflow_repository }}
                  ref: ${{ job.workflow_sha }}
                  path: ${{ env.PROGRAM }}
                  persist-credentials: false
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ needs.discover.outputs.node }}
                  cache: pnpm
            - env:
                  CHECK: ${{ toJSON(matrix) }}
              run: node "$PROGRAM/src/cli.ts" check

    build:
        name: Build
        needs: [discover, check]
        if: ${{ !cancelled() && needs.discover.outputs.build != '' && (needs.check.result == 'success' || needs.check.result == 'skipped') }}
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: ${{ job.workflow_repository }}
                  ref: ${{ job.workflow_sha }}
                  path: ${{ env.PROGRAM }}
                  persist-credentials: false
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ needs.discover.outputs.node }}
                  cache: pnpm
            - env:
                  BUILD: ${{ needs.discover.outputs.build }}
              run: node "$PROGRAM/src/cli.ts" build

name: Plan Workers Diff

# Comments the Terraform plan (create/update/delete) for a Cloudflare Workers
# project on the pull request, so a reviewer sees the infrastructure diff before
# merge. The plan is env-specific (HCP workspace <project>-<environment>). One
# comment per project and environment is edited on every run; an empty plan
# posts nothing unless that comment already exists.
#
# The caller decides WHEN to run it — trigger on nextnode.toml changes:
#
#   on:
#     pull_request:
#       paths: ['**/nextnode.toml']
#   permissions:
#     contents: read
#     pull-requests: write
#     id-token: write
#   jobs:
#     plan-infra:
#       uses: NextNodeSolutions/infrastructure/.github/workflows/plan-diff.yml@main
#       with:
#         environment: development
#         config_file: apps/web/nextnode.toml
#
# `id-token: write` lets the job read its credentials from the vault through
# GitHub OIDC.

on:
    workflow_call:
        inputs:
            environment:
                type: string
                required: true
                description: 'development or production - the plan is env-specific (workspace <project>-<env>)'
            config_file:
                type: string
                default: 'nextnode.toml'
                description: 'Path to nextnode.toml in the calling repo'

permissions:
    contents: read
    pull-requests: write
    id-token: write

env:
    # The CI project in Infisical, and the machine identity this workflow logs
    # in as through GitHub OIDC. Organization Variables: ids,
    # not credentials (README, "Vault setup").
    INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
    INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}

jobs:
    plan-infra:
        name: Plan infra diff
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: NextNodeSolutions/infrastructure/.github/actions/setup@main
              with:
                  infra: 'true'
                  deps: 'false'

            - name: Load secrets
              id: vault
              run: node src/index.ts load-secrets
              working-directory: .infra/packages/infrastructure

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v4.0.1
              with:
                  terraform_version: '~> 1.9'
                  terraform_wrapper: false

            - name: Plan infra diff
              run: node src/index.ts plan-infra
              working-directory: .infra/packages/infrastructure
              env:
                  PLANETSCALE_SERVICE_TOKEN_ID: ${{ steps.vault.outputs.PLANETSCALE_SERVICE_TOKEN_ID }}
                  PLANETSCALE_SERVICE_TOKEN: ${{ steps.vault.outputs.PLANETSCALE_SERVICE_TOKEN }}
                  PIPELINE_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config_file }}
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}
                  CLOUDFLARE_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ steps.vault.outputs.CLOUDFLARE_ACCOUNT_ID }}
                  TF_TOKEN_app_terraform_io: ${{ steps.vault.outputs.TF_CLOUD_TOKEN }}
                  TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
                  PLANETSCALE_ORGANIZATION: ${{ vars.PLANETSCALE_ORGANIZATION }}
                  COMPANY_DOMAIN: ${{ vars.COMPANY_DOMAIN }}
                  ACCESS_SESSION_DURATION: ${{ vars.ACCESS_SESSION_DURATION }}
                  GH_TOKEN: ${{ github.token }}
                  PIPELINE_PR_NUMBER: ${{ github.event.pull_request.number }}

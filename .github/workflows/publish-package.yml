name: Publish Package

# Builds and publishes one of this repository's packages. Bound to it: `publish`
# runs the package's release tooling - semantic-release, then the publish
# hooks of the package - with the npm token and vault access. That is caller
# code by construction, so the job refuses any other calling repository
# instead of pretending to isolate it. This repository's code and lockfile are the
# trusted base, like the pipeline CLI itself.

on:
    workflow_call:
        inputs:
            config_file:
                type: string
                default: 'nextnode.toml'
                description: 'Path to nextnode.toml in the calling repo'

permissions:
    contents: read

env:
    # The CI project in Infisical, and the machine identity this workflow logs
    # in as through GitHub OIDC. Organization Variables: ids,
    # not credentials (README, "Vault setup").
    INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
    INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}

jobs:
    plan:
        name: Plan
        runs-on: ubuntu-latest
        outputs:
            quality_matrix: ${{ steps.plan.outputs.quality_matrix }}
            project_name: ${{ steps.plan.outputs.project_name }}
            project_filter: ${{ steps.plan.outputs.project_filter }}
            publish: ${{ steps.plan.outputs.publish }}
        steps:
            - uses: NextNodeSolutions/infrastructure/.github/actions/setup@main
              with:
                  infra: 'true'
                  deps: 'false'

            - name: Plan pipeline
              id: plan
              run: node src/index.ts plan
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config_file }}

    quality:
        name: ${{ matrix.task.name }}
        needs: plan
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                task: ${{ fromJSON(needs.plan.outputs.quality_matrix) }}
        steps:
            - uses: NextNodeSolutions/infrastructure/.github/actions/setup@main

            - name: ${{ matrix.task.name }}
              run: ${{ matrix.task.cmd }}

    publish:
        name: Publish
        needs: [plan, quality]
        # This repository only (see the header). The build stays here: the release runs
        # from the same installed tree anyway.
        if: github.repository == 'NextNodeSolutions/infrastructure' && github.ref == 'refs/heads/main' && needs.plan.outputs.publish == 'true'
        runs-on: ubuntu-latest
        concurrency:
            group: publish-${{ needs.plan.outputs.project_name }}
            cancel-in-progress: false
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: NextNodeSolutions/infrastructure/.github/actions/setup@main
              with:
                  infra: 'true'
                  fetch-depth: '0'

            - name: Load secrets
              id: vault
              run: node src/index.ts load-secrets
              working-directory: .infra/packages/infrastructure

            - name: Build
              run: pnpm turbo run build --filter=${{ needs.plan.outputs.project_filter }}

            - name: Generate GitHub App token
              id: app-token
              uses: actions/create-github-app-token@v2
              with:
                  app-id: ${{ steps.vault.outputs.NEXTNODE_APP_ID }}
                  private-key: ${{ steps.vault.outputs.NEXTNODE_APP_PRIVATE_KEY }}
                  owner: NextNodeSolutions

            - name: Clear local tags for semantic-release
              run: git tag -l | xargs -r git tag -d

            - name: Sync with remote main
              run: git pull origin main --ff-only

            - name: Publish
              id: publish
              run: node src/index.ts publish
              working-directory: .infra/packages/infrastructure
              env:
                  PACKAGE_DIR: ${{ github.workspace }}/packages/${{ needs.plan.outputs.project_name }}
                  SR_OUTPUT_FILE: /tmp/sr-output.txt
                  NPM_TOKEN: ${{ steps.vault.outputs.NPM_TOKEN }}
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
                  HUSKY: '0'
                  NPM_CONFIG_PROVENANCE: 'true'

            - name: Parse result and summary
              if: always()
              run: node src/index.ts publish-result
              working-directory: .infra/packages/infrastructure
              env:
                  SR_OUTPUT_FILE: /tmp/sr-output.txt
                  PROJECT_FILTER: ${{ needs.plan.outputs.project_filter }}

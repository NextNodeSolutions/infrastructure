name: Teardown Cloudflare Workers

# Tears down a single Cloudflare Workers project for a target NextNode repo:
# deletes every Worker script via wrangler, then runs `terraform destroy` to
# remove the D1/KV/Queues/R2 + Redirect Rules. The HCP Terraform workspace is
# kept so the state history survives. `wipe_data` must be set when the project
# declares D1 or R2 — otherwise the teardown refuses to destroy stateful data.
#
# Run manually from the GitHub UI — access to this workflow is controlled by
# write access to this repository.

on:
    workflow_dispatch:
        inputs:
            repository:
                type: string
                required: true
                description: 'owner/repo of the target (e.g. NextNodeSolutions/my-site)'
            environment:
                type: choice
                required: true
                options:
                    - development
                    - production
                description: 'Environment to tear down'
            confirm:
                type: string
                required: true
                description: 'Type the project name (matches [project].name in the target nextnode.toml) to authorize teardown'
            wipe_data:
                type: boolean
                default: false
                description: 'Required when the project declares D1 or R2 — the data (databases, buckets) will be irreversibly destroyed'
            config_file:
                type: string
                default: nextnode.toml
                description: 'Path to nextnode.toml inside the target repo'

permissions:
    contents: read
    id-token: write

env:
    # The CI project in Infisical, and the machine identity this workflow logs
    # in as through GitHub OIDC. Organization Variables: ids,
    # not credentials (README, "Vault setup").
    INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
    INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}

jobs:
    teardown:
        name: Teardown
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: NextNodeSolutions/infrastructure/.github/actions/setup@main
              with:
                  infra: 'true'
                  deps: 'false'

            - name: Load secrets
              id: vault
              run: node src/index.ts load-secrets
              working-directory: .infra/packages/infrastructure

            - name: Generate GitHub App token
              id: app-token
              uses: actions/create-github-app-token@v2
              with:
                  app-id: ${{ steps.vault.outputs.NEXTNODE_APP_ID }}
                  private-key: ${{ steps.vault.outputs.NEXTNODE_APP_PRIVATE_KEY }}
                  owner: NextNodeSolutions

            - name: Checkout target repository
              uses: actions/checkout@v6
              with:
                  repository: ${{ inputs.repository }}
                  token: ${{ steps.app-token.outputs.token }}
                  path: target
                  sparse-checkout: ${{ inputs.config_file }}
                  sparse-checkout-cone-mode: false

            - name: Guard teardown confirmation
              run: node src/index.ts teardown-guard
              working-directory: .infra/packages/infrastructure
              env:
                  PIPELINE_CONFIG_FILE: ${{ github.workspace }}/target/${{ inputs.config_file }}
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}
                  TEARDOWN_CONFIRM: ${{ inputs.confirm }}

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v4.0.1
              with:
                  terraform_version: '~> 1.9'
                  terraform_wrapper: false

            - name: Teardown
              run: node src/index.ts teardown
              working-directory: .infra/packages/infrastructure
              env:
                  PLANETSCALE_SERVICE_TOKEN_ID: ${{ steps.vault.outputs.PLANETSCALE_SERVICE_TOKEN_ID }}
                  PLANETSCALE_SERVICE_TOKEN: ${{ steps.vault.outputs.PLANETSCALE_SERVICE_TOKEN }}
                  PIPELINE_CONFIG_FILE: ${{ github.workspace }}/target/${{ inputs.config_file }}
                  PIPELINE_ENVIRONMENT: ${{ inputs.environment }}
                  TEARDOWN_TARGET: project
                  TEARDOWN_WIPE_DATA: ${{ inputs.wipe_data && 'true' || '' }}
                  CLOUDFLARE_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ steps.vault.outputs.CLOUDFLARE_ACCOUNT_ID }}
                  TF_TOKEN_app_terraform_io: ${{ steps.vault.outputs.TF_CLOUD_TOKEN }}
                  TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
                  PLANETSCALE_ORGANIZATION: ${{ vars.PLANETSCALE_ORGANIZATION }}
                  COMPANY_DOMAIN: ${{ vars.COMPANY_DOMAIN }}
                  ACCESS_SESSION_DURATION: ${{ vars.ACCESS_SESSION_DURATION }}

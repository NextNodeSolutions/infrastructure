# NextNode central CI, run by CircleCI.
#
# Config source of every NextNode project pipeline. A project repository holds no
# CI file: its pipeline definition points here and checks out its own repository.
# The project supplies nextnode.toml, a pinned packageManager and its scripts.
#
#   checks       lint, formatting, types, tests of the project. No context, no secret.
#   deploy-dev   on main. Halts right after reading nextnode.toml when the project
#                declares no development environment.
#   hold         a person approves the production deployment in CircleCI.
#   deploy-prod  on main, after the approval. Uploads a version that receives no
#                traffic, checks its preview URL, promotes it only on success.
#   probe        on the canary, through the probe pipeline parameter: every attack
#                the project could run against the boundary below, each must fail.
#
# No CircleCI context is used: every job receives an OIDC token, and the only
# values a job needs besides secrets are identifiers written below.
#
# Two users share the job. The platform user owns the job: it trades the OIDC
# token for a vault token inside one step, keeps the platform secrets in a file
# only it can read, and runs Wrangler on the configuration the repository
# committed. The project user runs every project command through `project-run`:
# install, build, migrations. It receives the application's secrets of the
# environment being deployed, nothing else, and it cannot read the platform
# user's files or processes. Root access ends before the first project command;
# sudo then serves only to become the project user.
#
# Nothing the project controls is ever evaluated by a shell. Values read from
# nextnode.toml and produced by a deployment travel between steps as JSON files
# read with `nn`, in a directory of the platform user's home that the project
# user cannot write: a file created in a shared place after project code ran
# could be the project's. BASH_ENV carries only text written here.

version: 2.1

parameters:
  probe:
    type: boolean
    default: false
    description: Run the boundary probes in place of the pipeline. Set through the API, on the canary.

executors:
  node:
    docker:
      - image: cimg/node:24.9
    resource_class: small

commands:
  platform-tools:
    description: Install the platform tools at pinned versions into the platform user's home, from the cache when the versions are unchanged.
    steps:
      - run:
          name: Name the platform tools
          # The Pulumi CLI is released with its SDK under one version, and the Cloudflare
          # provider plugin with its SDK: both are installed at the SDK's version.
          command: echo "@infisical/cli@0.44.9 wrangler@4.152.0 smol-toml@1.9.1 jsonc-parser@3.3.1 @pulumi/pulumi@3.272.0 @pulumi/cloudflare@6.23.1" > /tmp/tools.txt
      - restore_cache:
          keys:
            - tools-{{ checksum "/tmp/tools.txt" }}
      - run:
          name: Install the platform tools, unless cached
          command: |
            cat >> "$BASH_ENV" \<<'ENV'
            export PATH=$HOME/.platform/node_modules/.bin:$HOME/.platform/pulumi:$PATH
            export PULUMI_HOME=$HOME/.platform/pulumi-home PULUMI_SKIP_UPDATE_CHECK=true
            ENV
            . "$BASH_ENV"
            [ -x ~/.platform/pulumi/pulumi ] && [ -x ~/.platform/node_modules/.bin/wrangler ] && [ -x ~/.platform/node_modules/.bin/infisical ] && exit 0
            version() { grep -oE "$1@[0-9.]+" /tmp/tools.txt | cut -d@ -f3; }
            mkdir -p ~/.platform
            # The CLI archive carries a host for every language; only Node's stays.
            curl -fsSL --retry 3 "https://github.com/pulumi/pulumi/releases/download/v$(version @pulumi/pulumi)/pulumi-v$(version @pulumi/pulumi)-linux-x64.tar.gz" | tar -xz -C ~/.platform
            find ~/.platform/pulumi -type f ! -name pulumi ! -name pulumi-language-nodejs ! -name pulumi-resource-pulumi-nodejs -delete
            # shellcheck disable=SC2046
            npm install --prefix ~/.platform --no-fund --no-audit $(cat /tmp/tools.txt)
            pulumi plugin install resource cloudflare "$(version @pulumi/cloudflare)"
      - save_cache:
          key: tools-{{ checksum "/tmp/tools.txt" }}
          paths: [~/.platform]
  pnpm-store:
    description: Restore the pnpm store of this pnpm version and lockfile, so the project's install links instead of downloading.
    steps:
      - restore_cache:
          keys:
            - pnpm-{{ checksum "/tmp/pnpm.txt" }}-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-{{ checksum "/tmp/pnpm.txt" }}-
  read-toml:
    description: Read nextnode.toml for the environment into a JSON file, or halt the job when the environment is not declared.
    steps:
      - run:
          name: Read nextnode.toml
          # CircleCI reserves `<<` in config v2.1, hence the escaped heredoc marker.
          command: |
            # The platform's own directory: the project user, in the platform's group, reads
            # it and writes nothing in it. Secret files in it are further restricted.
            mkdir -m 750 -p /home/circleci/platform /home/circleci/platform/wrangler
            cat > /tmp/read-toml.cjs \<<'JS'
            const { parse } = require(process.env.HOME + "/.platform/node_modules/smol-toml");
            const jsonc = require(process.env.HOME + "/.platform/node_modules/jsonc-parser");
            const fs = require("node:fs");
            const path = require("node:path");
            const toml = parse(fs.readFileSync("nextnode.toml", "utf8"));
            const env = process.env.NEXTNODE_ENVIRONMENT;
            if (!toml.environments?.[env]) {
              console.error(`nextnode.toml declares no environment "${env}"`);
              // A missing development environment is a choice, not an error: the job
              // halts and the workflow goes on.
              process.exit(env === "development" ? 3 : 1);
            }
            if (!/^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$/.test(toml.project?.name ?? "")) {
              console.error("nextnode.toml: project.name must be letters, digits, dots, dashes or underscores: it names the Pulumi project");
              process.exit(1);
            }
            const values = {
              project: toml.project.name,
              infisical_project: toml.project?.infisical_project,
              entry: toml.deploy?.entry ?? ".",
              health: toml.deploy?.health ?? "/",
              migrate: toml.deploy?.migrate ?? "",
              domain: toml.environments[env].domain,
            };
            // Wrangler later reads its configuration with the platform credential, so the
            // copy the repository committed is kept aside, named explicitly to Wrangler, and
            // restored before it runs. A build command in it would run project code with
            // that credential, so it is refused: the build is the project's build script.
            const configs = fs.readdirSync(values.entry).filter((f) => /^wrangler\.(jsonc?|toml)$/.test(f));
            if (configs.length !== 1) { console.error(`expected one Wrangler configuration in ${values.entry}, found ${configs.length}`); process.exit(1); }
            values.wrangler_config = configs[0];
            const text = fs.readFileSync(path.join(values.entry, configs[0]), "utf8");
            const wrangler = configs[0].endsWith(".toml") ? parse(text) : jsonc.parse(text, [], { allowTrailingComma: true });
            if (wrangler.build?.command || wrangler.env?.[env]?.build?.command) {
              console.error(`${configs[0]} declares a build command: the platform runs the project's build script instead`);
              process.exit(1);
            }
            // Routes and domains are Pulumi's: a route in the Wrangler configuration would be
            // fought over by every deployment.
            for (const scope of [wrangler, wrangler.env?.[env] ?? {}]) {
              if (scope.routes || scope.route) { console.error(`${configs[0]} declares routes: domains come from nextnode.toml, through Pulumi`); process.exit(1); }
            }
            // Wrangler deploys the environment's section of its configuration, under the name
            // that section gives or the top-level name suffixed with the environment.
            if (!wrangler.env?.[env]) { console.error(`${configs[0]} declares no env.${env}: the platform deploys that section`); process.exit(1); }
            values.worker_name = wrangler.env[env].name ?? `${wrangler.name}-${env}`;
            for (const [key, value] of Object.entries(values)) {
              if (value === undefined) { console.error(`nextnode.toml: missing ${key}`); process.exit(1); }
              console.log(`${key}=${value}`);
            }
            fs.writeFileSync("/home/circleci/platform/nextnode.json", JSON.stringify(values));
            fs.copyFileSync(path.join(values.entry, configs[0]), path.join("/home/circleci/platform/wrangler", configs[0]));
            JS
            node /tmp/read-toml.cjs && status=0 || status=$?
            if [ "$status" = 3 ]; then circleci-agent step halt; exit 0; fi
            [ "$status" = 0 ] || exit "$status"
            # `nn <file> <key>` reads one value of a platform JSON file, in any later step.
            echo 'nn() { node -p "require(\"/home/circleci/platform/\" + process.argv[1] + \".json\")[process.argv[2]] ?? \"\"" -- "$1" "$2"; }' >> "$BASH_ENV"
  install-pnpm:
    description: Install the pnpm version pinned in the project's package.json.
    steps:
      - run:
          name: Install the pnpm pinned in package.json
          command: |
            pin=$(node -p "require('./package.json').packageManager ?? ''")
            # A version, with an optional integrity hash. Not a URL, a tag or a path.
            [[ $pin =~ ^pnpm@[0-9]+\.[0-9]+\.[0-9]+(\+sha[0-9]+\.[0-9a-f]+)?$ ]] || { echo "package.json must pin pnpm as pnpm@<version> in packageManager, got '$pin'"; exit 1; }
            sudo npm install --global --no-fund --no-audit "$pin"
            # The store layout follows the pnpm version, so the store cache is keyed by it too.
            echo "$pin" > /tmp/pnpm.txt
  resources:
    description: Converge the environment's Cloudflare resources with Pulumi, from the platform user's own directory, on the state kept in the platform's R2 bucket.
    steps:
      - run:
          name: Resources
          # Runs once the Worker of this deployment is uploaded and before the smoke
          # request: a custom domain attaches to a Worker that exists, and a domain that
          # serves is never touched before its replacement is there.
          command: |
            set -a; . /home/circleci/platform/platform.env; set +a
            auth() { printf 'header = "Authorization: Bearer %s"\n' "$CLOUDFLARE_API_TOKEN"; }
            # Recreated empty: nothing that was there before is loaded.
            rm -rf /home/circleci/platform/pulumi && mkdir /home/circleci/platform/pulumi && cd /home/circleci/platform/pulumi
            ln -sfn ~/.platform/node_modules node_modules
            # JSON is YAML: the project name goes through a serializer, never into a template.
            node -e 'require("node:fs").writeFileSync("Pulumi.yaml", JSON.stringify({ name: require("/home/circleci/platform/nextnode.json").project, runtime: { name: "nodejs", options: { typescript: false } } }))'
            echo '{ "main": "index.js" }' > package.json
            cat > index.js \<<'JS'
            // The Cloudflare resources of one environment of one project. Inputs: the JSON that
            // read-toml wrote from nextnode.toml and the platform account. Resources keyed by
            // nextnode.toml entries are added here.
            const cloudflare = require("@pulumi/cloudflare");
            const spec = require("/home/circleci/platform/nextnode.json");
            const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;

            // The zone is the longest registered name of the account that the domain belongs to.
            const zone = cloudflare.getZonesOutput({ account: { id: accountId } }).apply(({ results }) => {
              const holding = results.filter((z) => spec.domain === z.name || spec.domain.endsWith(`.${z.name}`));
              if (holding.length === 0) throw new Error(`${spec.domain}: no zone of the account holds this domain`);
              return holding.sort((a, b) => b.name.length - a.name.length)[0];
            });

            // The environment's domain, attached to the Worker Wrangler has just uploaded.
            new cloudflare.WorkersCustomDomain("domain", {
              accountId,
              zoneId: zone.id,
              hostname: spec.domain,
              service: spec.worker_name,
            });

            exports.domain = spec.domain;
            exports.zone = zone.name;
            JS
            # The state bucket is reached through R2's S3 API with the platform token itself:
            # R2 accepts a token's id as access key and the token's SHA-256 as secret key.
            AWS_ACCESS_KEY_ID=$(curl -fsS -K <(auth) https://api.cloudflare.com/client/v4/user/tokens/verify | node -e 'let s = ""; process.stdin.on("data", (d) => s += d).on("end", () => process.stdout.write(JSON.parse(s).result.id))')
            AWS_SECRET_ACCESS_KEY=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-64)
            export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION=auto
            pulumi login "s3://$NEXTNODE_STATE_BUCKET?endpoint=$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com&region=auto&s3ForcePathStyle=true" > /dev/null
            pulumi stack select --create "$NEXTNODE_ENVIRONMENT"
            # Refreshed first: what disappeared outside Pulumi, such as a domain that went with
            # a deleted Worker, leaves the state instead of failing its own deletion.
            pulumi up --refresh --yes --skip-preview --non-interactive --suppress-progress
  isolate-project:
    description: Create the project user, hand it the checkout, and end root access. Sudo then only becomes that user.
    steps:
      - run:
          name: Create the project user and end root access
          command: |
            sudo useradd --create-home --gid circleci --shell /bin/bash project
            sudo chmod -R g+w .
            # The pnpm store is the platform user's, restored from the cache; the project user adds to it.
            mkdir -p ~/.pnpm-store && chmod -R g+ws ~/.pnpm-store
            echo 'circleci ALL=(project) NOPASSWD:SETENV: ALL' | sudo tee /etc/sudoers.d/60-project > /dev/null
            sudo visudo -cf /etc/sudoers.d/60-project
            sudo rm /etc/sudoers.d/50-circleci
            if sudo -n true 2> /dev/null; then echo "root access is still available"; exit 1; fi
            echo "root access ended, project commands run as $(sudo -nu project id -un)"
            # Git runs what the repository configures (hooks, core.fsmonitor), and Wrangler
            # calls git for version metadata. The platform user has no further use for git,
            # so its git finds no repository from here on. project-run removes the variable.
            echo 'export GIT_DIR=/nonexistent' >> "$BASH_ENV"
  forget-job-token:
    description: Remove the OIDC token from every later step, once the job has no further use for it.
    steps:
      - run:
          name: Forget the job token
          # Every later step sources this file first.
          command: |
            { echo 'unset CIRCLE_OIDC_TOKEN CIRCLE_OIDC_TOKEN_V2'; cat "$BASH_ENV"; } > "$BASH_ENV.next" && mv "$BASH_ENV.next" "$BASH_ENV"
  project-run:
    description: Run a project command as the project user, with the application's secrets and without the job's OIDC tokens.
    parameters:
      step:
        type: string
        default: ""
      command:
        type: string
    steps:
      - run:
          name: <<# parameters.step >><< parameters.step >><</ parameters.step >><<^ parameters.step >><< parameters.command >><</ parameters.step >>
          # exec: no process the project user could read ever held the tokens.
          # GIT_DIR: the platform's git is inert, the project's keeps working in the checkout.
          # umask: the platform user, same group, can read and write what the project builds.
          command: exec env -u CIRCLE_OIDC_TOKEN -u CIRCLE_OIDC_TOKEN_V2 -u GIT_DIR HOME=/home/project npm_config_store_dir=/home/circleci/.pnpm-store sudo -nE -u project bash -eo pipefail -c 'umask 002; set -a; [ -f ~/app.env ] && . ~/app.env; set +a; << parameters.command >>'

jobs:
  checks:
    executor: node
    steps:
      - checkout
      - install-pnpm
      - pnpm-store
      - isolate-project
      - project-run:
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-{{ checksum "/tmp/pnpm.txt" }}-{{ checksum "pnpm-lock.yaml" }}
          paths: [~/.pnpm-store]
      - project-run:
          command: pnpm lint
      - project-run:
          command: pnpm format:check
      - project-run:
          command: pnpm type-check
      - project-run:
          step: Tests
          command: |
            if node -e "process.exit(require(\"./package.json\").scripts?.test ? 0 : 1)"; then
              pnpm test
            else
              echo "No test script declared in package.json: nothing to run."
            fi

  deploy:
    parameters:
      environment:
        type: enum
        enum: [development, production]
    executor: node
    environment:
      NEXTNODE_ENVIRONMENT: << parameters.environment >>
      # Identifiers, not secrets. The vault identity accepts only tokens issued for
      # the main ref of a repository of the organization.
      INFISICAL_IDENTITY_ID: 17af2913-5649-4771-b149-aa9bf50ff39d
      INFISICAL_PLATFORM_PROJECT_ID: 721a5f71-3801-40e2-a06d-a4a9b431e1c7
      NEXTNODE_STATE_BUCKET: nextnode-state
    steps:
      - checkout
      - platform-tools
      - read-toml
      - install-pnpm
      - pnpm-store
      - isolate-project
      - run:
          name: Fetch the secrets of << parameters.environment >>
          command: |
            : "${CIRCLE_OIDC_TOKEN_V2:?this job needs the OIDC token}"
            : "${INFISICAL_IDENTITY_ID:?}" "${INFISICAL_PLATFORM_PROJECT_ID:?}"
            # Reads the vault's JSON export, prints the names, writes shell literals.
            cat > /tmp/export.cjs \<<'JS'
            let s = ""; process.stdin.on("data", (d) => s += d).on("end", () => {
              const secrets = JSON.parse(s);
              const literal = (value) => `'${String(value).replace(/'/g, `'\\''`)}'`;
              process.stdout.write(secrets.map((x) => `export ${x.key}=${literal(x.value)}\n`).join(""));
              console.error(`${secrets.length} secret(s): ${secrets.map((x) => x.key).join(", ")}`);
            });
            JS
            token=$(infisical login --method=oidc-auth --machine-identity-id="$INFISICAL_IDENTITY_ID" --jwt="$CIRCLE_OIDC_TOKEN_V2" --plain --silent)
            export_project() { infisical export --token "$token" --projectId "$1" --env "$2" --format json --silent | node /tmp/export.cjs; }
            # The platform project has a single environment: one account serves every
            # deployment environment. Its secrets stay with the platform user.
            echo -n "platform: "; (umask 077; export_project "$INFISICAL_PLATFORM_PROJECT_ID" main > /home/circleci/platform/platform.env)
            # The application project carries the per-environment split. Its secrets go
            # to the project user, in a file only that user reads.
            echo -n "application: "; export_project "$(nn nextnode infisical_project)" "$NEXTNODE_ENVIRONMENT" | sudo -nu project sh -c 'umask 077; cat > /home/project/app.env'
      - forget-job-token
      - project-run:
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-{{ checksum "/tmp/pnpm.txt" }}-{{ checksum "pnpm-lock.yaml" }}
          paths: [~/.pnpm-store]
      - project-run:
          command: pnpm build
      - project-run:
          step: Migrations
          # sudo drops BASH_ENV, so a project shell has no `nn`: it reads the JSON itself.
          command: migrate=$(node -p "require(\"/home/circleci/platform/nextnode.json\").migrate"); if [ -n "$migrate" ]; then echo "+ $migrate"; eval "$migrate"; else echo "No migrate command in nextnode.toml, nothing to run."; fi
      - run:
          name: Deploy
          # Development replaces what serves, and so does a production Worker's first
          # deployment, when nothing serves yet. Every other production deployment is a
          # version without traffic, promoted by a later step. Wrangler runs as the
          # platform user on the committed configuration: it bundles and uploads, it
          # does not run project code.
          command: |
            cd "$(nn nextnode entry)"
            config=$(nn nextnode wrangler_config)
            rm -f "$config" && cp "/home/circleci/platform/wrangler/$config" "$config"
            set -a; . /home/circleci/platform/platform.env; set +a
            workers_dev_url() { grep -oE "https://[a-z0-9.-]+\.workers\.dev" /home/circleci/platform/wrangler.log | head -1 || true; }
            record() { node -e 'require("node:fs").writeFileSync("/home/circleci/platform/deploy.json", JSON.stringify({ version: process.argv[1], url: process.argv[2] }))' -- "$1" "$2"; }
            direct() {
              wrangler deploy --config "$config" --env "$NEXTNODE_ENVIRONMENT" 2>&1 | tee /home/circleci/platform/wrangler.log
              # The health check targets the workers.dev URL when there is one, else the declared domain.
              url=$(workers_dev_url)
              record "" "${url:-https://$(nn nextnode domain)}"
            }
            if [ "$NEXTNODE_ENVIRONMENT" = development ]; then direct; exit 0; fi
            if ! listed=$(wrangler versions list --config "$config" --env "$NEXTNODE_ENVIRONMENT" 2>&1); then
              # 10007 is Cloudflare's code for a Worker that does not exist. Any other error stops here.
              printf '%s\n' "$listed" | grep -q "code: 10007" || { printf '%s\n' "$listed"; exit 1; }
              echo "First deployment of this Worker: nothing serves yet, deployed directly."
              direct; exit 0
            fi
            wrangler versions upload --config "$config" --env "$NEXTNODE_ENVIRONMENT" --message "$CIRCLE_SHA1" 2>&1 | tee /home/circleci/platform/wrangler.log
            version=$(grep -oE "Worker Version ID: [0-9a-f-]+" /home/circleci/platform/wrangler.log | head -1 | cut -d" " -f4 || true)
            preview=$(workers_dev_url)
            [ -n "$version" ] || { echo "wrangler printed no version id"; exit 1; }
            [ -n "$preview" ] || { echo "wrangler printed no preview URL: the production Worker needs preview_urls"; exit 1; }
            record "$version" "$preview"
      - resources
      - run:
          name: Smoke
          command: |
            url="$(nn deploy url)$(nn nextnode health)"
            curl -fsS --retry 5 --retry-delay 3 --retry-all-errors -o /dev/null -w "%{http_code} $url\n" "$url"
      - run:
          name: Promote the version to all traffic
          command: |
            version=$(nn deploy version)
            [ -n "$version" ] || { echo "Deployed directly, already serving."; exit 0; }
            cd "$(nn nextnode entry)"
            config=$(nn nextnode wrangler_config)
            rm -f "$config" && cp "/home/circleci/platform/wrangler/$config" "$config"
            set -a; . /home/circleci/platform/platform.env; set +a
            wrangler versions deploy "$version@100%" --config "$config" --env "$NEXTNODE_ENVIRONMENT" --message "$CIRCLE_SHA1" --yes

  probe:
    # The boundary's regression test. Every probe is an attack the project could run,
    # through the same entry point as a project command, and passes only when the
    # attack fails. No vault login: the files it attacks stand in for the real ones,
    # written the way the vault step writes them.
    executor: node
    environment:
      # Every project declares production, so the job never halts with zero probes run.
      NEXTNODE_ENVIRONMENT: production
    steps:
      - checkout
      - platform-tools
      - read-toml
      - run:
          name: "Probe: a second Wrangler configuration, a build command and a route are refused"
          # Each attack on a fresh copy of the checkout, and an accepted attack ends the
          # step at once: in an && list, set -e would let it pass.
          command: |
            entry=$(nn nextnode entry); config=$(nn nextnode wrangler_config)
            case "$config" in *.json|*.jsonc) ;; *) echo "this probe edits a JSON configuration, the canary commits $config"; exit 1;; esac
            fresh() { cd /tmp && work=$(mktemp -d) && cp -r ~/project/. "$work" && cd "$work"; }
            refused() { if node /tmp/read-toml.cjs > /dev/null 2>&1; then echo "accepted: $1"; exit 1; fi; echo "refused: $1"; }
            # Adds keys to the committed configuration, through a parser.
            with() { node -e 'const fs = require("node:fs"), jsonc = require(process.env.HOME + "/.platform/node_modules/jsonc-parser"); const file = process.argv[1]; const config = jsonc.parse(fs.readFileSync(file, "utf8"), [], { allowTrailingComma: true }); fs.writeFileSync(file, JSON.stringify({ ...config, ...JSON.parse(process.argv[2]) }))' -- "$entry/$config" "$1"; }
            fresh; touch "$entry/wrangler.toml"; refused "a second Wrangler configuration"
            fresh; with '{ "build": { "command": "true" } }'; refused "a build command"
            fresh; with '{ "routes": ["probe.example/*"] }'; refused "a route"
      - run:
          name: "Probe: a value read from a platform file stays text"
          command: |
            node -e 'require("node:fs").writeFileSync("/home/circleci/platform/literal.json", JSON.stringify({ value: "$(touch /tmp/probe-evaluated) `touch /tmp/probe-evaluated`; touch /tmp/probe-evaluated" }))'
            [ "$(nn literal value)" = '$(touch /tmp/probe-evaluated) `touch /tmp/probe-evaluated`; touch /tmp/probe-evaluated' ] && [ ! -e /tmp/probe-evaluated ]
      - isolate-project
      - run:
          name: Stand in for the vault step
          command: |
            (umask 077; echo 'export PLATFORM_PROBE=platform' > /home/circleci/platform/platform.env)
            echo 'export APP_PROBE=application' | sudo -nu project sh -c 'umask 077; cat > /home/project/app.env'
            # Project shells have no BASH_ENV: the path reaches the probes through a platform file.
            node -e 'require("node:fs").writeFileSync("/home/circleci/platform/probe.json", JSON.stringify({ bash_env: process.env.BASH_ENV }))'
            stat -c '%U:%G %a %n' "$BASH_ENV" /home/circleci/platform /home/circleci/platform/platform.env
            # What a same-user process would read: the token is there, and the probes must not reach it.
            grep -qsa CIRCLE_OIDC_TOKEN "/proc/$$/environ" || { echo "this platform step does not hold the token in /proc/$$/environ: the process probe would prove nothing"; exit 1; }
      - forget-job-token
      - run:
          name: "Probe: the job token is gone from the platform steps"
          command: '[ -z "${CIRCLE_OIDC_TOKEN:-}${CIRCLE_OIDC_TOKEN_V2:-}" ]'
      - project-run:
          step: "Probe: the project receives its own secrets and not the platform's"
          command: '[ "$APP_PROBE" = application ] && [ -z "${PLATFORM_PROBE:-}" ]'
      - project-run:
          step: "Probe: the project finds no job token in its environment"
          # Anchored on a name: sudo records the command, pattern included, in SUDO_COMMAND.
          command: '! env | grep -Eq "^CIRCLE_OIDC_TOKEN(_V2)?="'
      - project-run:
          step: "Probe: the project finds no job token in any process it can inspect"
          command: '! grep -Eqsaz "^CIRCLE_OIDC_TOKEN(_V2)?=" /proc/[0-9]*/environ'
      - project-run:
          step: "Probe: the project cannot read the platform's secrets"
          command: '! cat /home/circleci/platform/platform.env'
      - project-run:
          step: "Probe: the project cannot write in the platform's directory"
          command: '! touch /home/circleci/platform/probe'
      - project-run:
          step: "Probe: the project cannot append to the file every platform step sources"
          command: 'file=$(node -p "require(\"/home/circleci/platform/probe.json\").bash_env"); [ -n "$file" ] && ! sh -c "echo probe >> $file"'
      - run:
          name: "Probe: the sourced file holds only the pipeline's text"
          command: '! grep -qx probe "$BASH_ENV"'
      - project-run:
          step: "Probe: the project cannot become another user"
          command: '! sudo -n true && ! sudo -nu circleci true'
      - project-run:
          step: "Probe: the project configures git to run a command"
          command: 'printf "[core]\n\tfsmonitor = /bin/sh -c \"touch /tmp/probe-fsmonitor-ran\"\n" >> .git/config && grep -q fsmonitor .git/config'
      - run:
          name: "Probe: the platform's git finds no repository, so the configured command never runs"
          command: |
            cd "$(nn nextnode entry)"
            if git status > /dev/null 2>&1; then echo "the platform's git found a repository"; exit 1; fi
            [ ! -e /tmp/probe-fsmonitor-ran ]

workflows:
  pipeline:
    unless: << pipeline.parameters.probe >>
    jobs:
      - checks
      - deploy:
          name: deploy-dev
          environment: development
          requires: [checks]
          filters: &main
            branches:
              only: main
      - hold:
          type: approval
          requires: [deploy-dev]
          filters: *main
      - deploy:
          name: deploy-prod
          environment: production
          requires: [hold]
          filters: *main
  probes:
    when: << pipeline.parameters.probe >>
    jobs:
      - probe

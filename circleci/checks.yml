# NextNode central CI, run by CircleCI.
#
# Config source of every NextNode project pipeline. A project repository holds no
# CI file: its pipeline definition points here and checks out its own repository.
# The project supplies nextnode.toml, a pinned packageManager and its scripts.
#
#   checks       lint, formatting, types, tests of the project. No context, no secret.
#   deploy-dev   on main. Halts at once when the project declares no development
#                environment, so the workflow continues to the approval.
#   hold         a person approves the production deployment in CircleCI.
#   deploy-prod  on main, after the approval. Uploads a version that receives no
#                traffic, checks its preview URL, promotes it only on success.
#
# No CircleCI context is used: every job receives an OIDC token, and the only
# values a job needs besides secrets are identifiers written below.
#
# How secrets flow: a deployment job trades its OIDC token for a vault token
# that lives only in the step that fetched the secrets. The environment's
# secrets are exported to the following steps; the vault token never is, and the
# OIDC variables are removed from every later step before anything else runs.
#
# Project code runs through `project-run`, in a process that replaced the step
# shell and never held the OIDC variables. With the variables gone from the
# later steps and from every process the project code can inspect, a dependency
# with a lifecycle script finds no token to trade.

version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:24.9
    resource_class: small

commands:
  install-pnpm:
    description: Install the pnpm version pinned in the project's package.json.
    steps:
      - run:
          name: Install the pnpm pinned in package.json
          command: |
            pin=$(node -p "require('./package.json').packageManager ?? ''")
            [[ $pin == pnpm@* ]] || { echo "package.json must pin pnpm in packageManager, got '$pin'"; exit 1; }
            sudo npm install --global --no-fund --no-audit "$pin"
  drop-sudo:
    description: End the passwordless sudo of the image before any project code runs.
    steps:
      - run:
          # The agent that holds the job token runs as root. Without sudo, project code
          # cannot read its environment. The platform tools are installed before this.
          name: Drop sudo
          command: sudo chmod u-s /usr/bin/sudo && { sudo -n true 2>/dev/null && exit 1 || echo "sudo is gone for the rest of the job"; }
  project-run:
    description: Run a project command in a process that never held the job's OIDC tokens.
    parameters:
      step:
        type: string
      command:
        type: string
    steps:
      - run:
          name: << parameters.step >>
          command: exec env -u CIRCLE_OIDC_TOKEN -u CIRCLE_OIDC_TOKEN_V2 bash -eo pipefail -c '<< parameters.command >>'

jobs:
  checks:
    executor: node
    steps:
      - checkout
      - install-pnpm
      - drop-sudo
      - project-run:
          step: pnpm install --frozen-lockfile
          command: pnpm install --frozen-lockfile
      - project-run:
          step: pnpm lint
          command: pnpm lint
      - project-run:
          step: pnpm format:check
          command: pnpm format:check
      - project-run:
          step: pnpm type-check
          command: pnpm type-check
      - project-run:
          step: Tests
          command: |
            if node -e "process.exit(require(\"./package.json\").scripts?.test ? 0 : 1)"; then
              pnpm test
            else
              echo "No test script declared in package.json: nothing to run."
            fi

  deploy:
    parameters:
      environment:
        type: enum
        enum: [development, production]
    executor: node
    environment:
      NEXTNODE_ENVIRONMENT: << parameters.environment >>
      # Identifiers, not secrets. The vault identity accepts only tokens issued for
      # the main ref of a repository of the organization.
      INFISICAL_IDENTITY_ID: 17af2913-5649-4771-b149-aa9bf50ff39d
      INFISICAL_PLATFORM_PROJECT_ID: 721a5f71-3801-40e2-a06d-a4a9b431e1c7
    steps:
      - checkout
      - install-pnpm
      - run:
          name: Install the platform tools
          command: sudo npm install --global --no-fund --no-audit @infisical/cli@0.44.9 wrangler@4.152.0 smol-toml@1.9.1
      - drop-sudo
      - run:
          name: Read nextnode.toml
          # CircleCI reserves `<<` in config v2.1, hence the escaped heredoc marker.
          command: |
            cat > /tmp/read-toml.cjs \<<'JS'
            const { parse } = require("smol-toml");
            const fs = require("node:fs");
            const toml = parse(fs.readFileSync("nextnode.toml", "utf8"));
            const env = process.env.NEXTNODE_ENVIRONMENT;
            if (!toml.environments?.[env]) {
              console.error(`nextnode.toml declares no environment "${env}"`);
              // A missing development environment is a choice, not an error: the job
              // halts and the workflow goes on to the approval.
              process.exit(env === "development" ? 3 : 1);
            }
            const values = {
              NEXTNODE_PROJECT: toml.project.name,
              NEXTNODE_INFISICAL_PROJECT: toml.project.infisical_project,
              NEXTNODE_ENTRY: toml.deploy.entry ?? ".",
              NEXTNODE_HEALTH: toml.deploy.health ?? "/",
              NEXTNODE_MIGRATE: toml.deploy.migrate ?? "",
            };
            // Single quotes: the values come from the project and must stay literal
            // when the next step sources the file.
            const literal = (value) => `'${String(value).replace(/'/g, `'\\''`)}'`;
            for (const [key, value] of Object.entries(values)) {
              if (value === undefined) { console.error(`nextnode.toml: missing ${key}`); process.exit(1); }
              fs.appendFileSync(process.env.BASH_ENV, `export ${key}=${literal(value)}\n`);
              console.log(`${key}=${value}`);
            }
            JS
            NODE_PATH=$(npm root -g) node /tmp/read-toml.cjs && exit 0
            status=$?
            [ "$status" = 3 ] && circleci-agent step halt
            exit "$status"
      - run:
          name: Fetch the secrets of << parameters.environment >>
          command: |
            : "${CIRCLE_OIDC_TOKEN_V2:?this job needs the OIDC token}"
            : "${INFISICAL_IDENTITY_ID:?}" "${INFISICAL_PLATFORM_PROJECT_ID:?}"
            token=$(infisical login --method=oidc-auth --machine-identity-id="$INFISICAL_IDENTITY_ID" --jwt="$CIRCLE_OIDC_TOKEN_V2" --plain --silent)
            export_project() {
              infisical export --token "$token" --projectId "$1" --env "$2" --format dotenv-export --silent >> "$BASH_ENV"
              echo "project $1, environment $2: $(infisical export --token "$token" --projectId "$1" --env "$2" --format json --silent | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const k=JSON.parse(s).map(x=>x.key);console.log(k.length+" secret(s): "+k.join(", "))})')"
            }
            # The platform project has a single environment: one account serves every
            # deployment environment. The application project carries the per-environment split.
            export_project "$INFISICAL_PLATFORM_PROJECT_ID" main
            export_project "$NEXTNODE_INFISICAL_PROJECT" "$NEXTNODE_ENVIRONMENT"
            # The job token has done its work. Every later step sources this file first,
            # so the variables are gone before any line a project command may have added.
            { echo 'unset CIRCLE_OIDC_TOKEN CIRCLE_OIDC_TOKEN_V2'; cat "$BASH_ENV"; } > "$BASH_ENV.next" && mv "$BASH_ENV.next" "$BASH_ENV"
      - project-run:
          step: pnpm install --frozen-lockfile
          command: pnpm install --frozen-lockfile
      - project-run:
          step: pnpm build
          command: pnpm build
      - project-run:
          step: Migrations
          command: if [ -n "$NEXTNODE_MIGRATE" ]; then echo "+ $NEXTNODE_MIGRATE"; eval "$NEXTNODE_MIGRATE"; else echo "No migrate command in nextnode.toml, nothing to run."; fi
      - when:
          condition:
            equal: [development, << parameters.environment >>]
          steps:
            - project-run:
                step: Deploy the Worker
                command: |
                  cd "$NEXTNODE_ENTRY"
                  wrangler deploy --env "$NEXTNODE_ENVIRONMENT" 2>&1 | tee /tmp/wrangler.log
                  url=$(grep -oE "https://[a-z0-9.-]+\.workers\.dev" /tmp/wrangler.log | head -1)
                  [ -n "$url" ] || { echo "wrangler printed no workers.dev URL: the development Worker needs workers_dev"; exit 1; }
                  echo "export NEXTNODE_URL=$url" >> "$BASH_ENV"
            - run:
                name: Smoke
                command: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors -o /dev/null -w "%{http_code} ${NEXTNODE_URL}${NEXTNODE_HEALTH}\n" "${NEXTNODE_URL}${NEXTNODE_HEALTH}"
      - when:
          condition:
            equal: [production, << parameters.environment >>]
          steps:
            - project-run:
                step: Upload a version that receives no traffic
                command: |
                  cd "$NEXTNODE_ENTRY"
                  if ! wrangler versions upload --env "$NEXTNODE_ENVIRONMENT" --message "$CIRCLE_SHA1" 2>&1 | tee /tmp/wrangler.log; then
                    grep -q "does not yet exist" /tmp/wrangler.log || exit 1
                    # A Worker gets versions only after its first deployment. Nothing serves
                    # yet, so there is nothing to protect: deploy directly, once.
                    echo "First deployment of this Worker, deployed directly."
                    wrangler deploy --env "$NEXTNODE_ENVIRONMENT" 2>&1 | tee /tmp/wrangler.log
                    echo "export NEXTNODE_VERSION= NEXTNODE_URL=$(grep -oE "https://[a-z0-9.-]+\.workers\.dev" /tmp/wrangler.log | head -1)" >> "$BASH_ENV"
                    exit 0
                  fi
                  version=$(grep -oE "Worker Version ID: [0-9a-f-]+" /tmp/wrangler.log | head -1 | cut -d" " -f4)
                  preview=$(grep -oE "https://[a-z0-9.-]+\.workers\.dev" /tmp/wrangler.log | head -1)
                  [ -n "$version" ] || { echo "wrangler printed no version id"; exit 1; }
                  [ -n "$preview" ] || { echo "wrangler printed no preview URL: the production Worker needs preview_urls"; exit 1; }
                  echo "export NEXTNODE_VERSION=$version NEXTNODE_URL=$preview" >> "$BASH_ENV"
            - run:
                name: Smoke the preview, the previous version keeps serving meanwhile
                command: |
                  [ -n "$NEXTNODE_URL" ] || { echo "No URL to check on a first deployment without workers.dev."; exit 0; }
                  curl -fsS --retry 5 --retry-delay 3 --retry-all-errors -o /dev/null -w "%{http_code} ${NEXTNODE_URL}${NEXTNODE_HEALTH}\n" "${NEXTNODE_URL}${NEXTNODE_HEALTH}"
            - project-run:
                step: Promote the version to all traffic
                command: |
                  [ -n "$NEXTNODE_VERSION" ] || { echo "First deployment, already serving."; exit 0; }
                  cd "$NEXTNODE_ENTRY" && wrangler versions deploy "$NEXTNODE_VERSION@100%" --env "$NEXTNODE_ENVIRONMENT" --message "$CIRCLE_SHA1" --yes

workflows:
  pipeline:
    jobs:
      - checks
      - deploy:
          name: deploy-dev
          environment: development
          requires: [checks]
          filters: &main
            branches:
              only: main
      - hold:
          type: approval
          requires: [deploy-dev]
          filters: *main
      - deploy:
          name: deploy-prod
          environment: production
          requires: [hold]
          filters: *main

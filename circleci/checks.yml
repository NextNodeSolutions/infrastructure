# NextNode central CI, run by CircleCI.
#
# Config source of every NextNode project pipeline. A project repository holds no
# CI file: its pipeline definition points here and checks out its own repository.
# The project supplies nextnode.toml, a pinned packageManager and its scripts.
#
#   checks       lint, formatting, types, tests of the project. No context, no secret.
#   deploy-dev   on main. Halts right after reading nextnode.toml when the project
#                declares no development environment.
#   hold         a person approves the production deployment in CircleCI.
#   deploy-prod  on main, after the approval. Uploads a version that receives no
#                traffic, checks its preview URL, promotes it only on success.
#   probe        on the canary, through the probe pipeline parameter: every attack
#                the project could run against the boundary below, each must fail.
#
# No CircleCI context is used: every job receives OIDC tokens, and the only values
# a job needs besides secrets are identifiers written below.
#
# A project is its repository. The repository's name, as CircleCI checked it out,
# names the Pulumi project that holds its state and the vault project that holds
# its secrets. No value of the project's files names either.
#
# Two users share the job. The platform user owns the job: it trades an OIDC token
# for a vault token inside one step, keeps the platform secrets in a file only it
# can read, and runs Wrangler on the configuration the repository committed. The
# project user runs every project command through `project-run`: install, build,
# migrations. Its environment is built from a list written here, it receives the
# application's secrets of the environment being deployed and nothing else, and it
# cannot read the platform user's files or processes. Root access ends before the
# first project command; sudo then serves only to become the project user, and
# every process of that user is ended before the platform reads the checkout again.
#
# The platform package of this repository, cloned at `program_ref` before anything
# else, holds every program the job runs and every npm tool it uses, at the versions
# its lockfile names. The parameter is `main` unless a canary run names a branch, so
# a project always runs the programs that `main` holds, as it runs this file from `main`.
#
# Nothing the project controls is ever evaluated by a shell. Values read from
# nextnode.toml and produced by a deployment travel between steps as JSON files
# read with `nn`, in a directory of the platform user's home that the project
# user cannot write: a file created in a shared place after project code ran
# could be the project's. BASH_ENV carries only text written here.

version: 2.1

parameters:
  program_ref:
    type: string
    default: main
    description: Git ref of this repository to take the platform package from. Only an API trigger can set it, and the job accepts a value other than main on the canary only.
  probe:
    type: boolean
    default: false
    description: Run the boundary probes in place of the pipeline. Set through the API, on the canary.

executors:
  node:
    docker:
      - image: cimg/node:24.9
    resource_class: small

# The canary is the one project that runs a branch of this repository and the probe job.
canary: &canary
  NEXTNODE_CANARY_PROJECT_ID: 01fc0b41-1871-4e49-85f1-6780a36e5b23
  # A pipeline parameter reaches the shell as a variable, never as text of a command.
  NEXTNODE_PROGRAM_REF: << pipeline.parameters.program_ref >>

commands:
  platform-package:
    description: Clone the platform package from this repository at program_ref into the platform's directory and install its dependencies, from the cache when its lockfile is unchanged.
    steps:
      - run:
          name: Clone the platform package
          # Shallow, over HTTPS, no credential: this repository is public and holds no
          # secret by construction. The platform's directory is created here, before any
          # project code: the project user, in the platform's group, reads it and writes
          # nothing in it. Secret files in it are further restricted.
          command: |
            : "${CIRCLE_PROJECT_REPONAME:?this job needs the repository name}" "${CIRCLE_PROJECT_ID:?}"
            [[ $NEXTNODE_PROGRAM_REF =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || { echo "program_ref is not a git ref"; exit 1; }
            [ "$NEXTNODE_PROGRAM_REF" = main ] || [ "$CIRCLE_PROJECT_ID" = "$NEXTNODE_CANARY_PROJECT_ID" ] || { echo "program_ref other than main is for the canary"; exit 1; }
            mkdir -m 750 -p /home/circleci/platform
            git clone -q --depth 1 --branch "$NEXTNODE_PROGRAM_REF" https://github.com/NextNodeSolutions/infrastructure.git /home/circleci/platform/infrastructure
            echo "repository $CIRCLE_PROJECT_REPONAME, platform package at $(git -C /home/circleci/platform/infrastructure rev-parse --short HEAD) ($NEXTNODE_PROGRAM_REF)"
            echo 'export PATH=/home/circleci/platform/infrastructure/platform/node_modules/.bin:$PATH' >> "$BASH_ENV"
      - restore_cache:
          keys:
            - platform-{{ checksum "/home/circleci/platform/infrastructure/platform/package-lock.json" }}
      - run:
          name: Install the platform package's dependencies, unless cached
          command: cd /home/circleci/platform/infrastructure/platform && { [ -d node_modules ] || npm ci --omit=dev --no-fund --no-audit; }
      - save_cache:
          key: platform-{{ checksum "/home/circleci/platform/infrastructure/platform/package-lock.json" }}
          paths: [/home/circleci/platform/infrastructure/platform/node_modules]
  read-toml:
    description: Read nextnode.toml and the Wrangler configuration for the environment into the spec, or halt the job when the environment is not declared.
    steps:
      - run:
          name: Read nextnode.toml
          command: |
            node /home/circleci/platform/infrastructure/platform/read.ts --repository "$CIRCLE_PROJECT_REPONAME" --environment "$NEXTNODE_ENVIRONMENT" --platform /home/circleci/platform && status=0 || status=$?
            if [ "$status" = 3 ]; then circleci-agent step halt; exit 0; fi
            [ "$status" = 0 ] || exit "$status"
            # Wrangler reads dotenv files from its working directory into its own
            # environment, so it runs from the platform's directory, on this empty file.
            : > /home/circleci/platform/empty.env
            # Three functions for the later steps, text written here and nothing else.
            # `nn <file> <key>` reads one value of a platform JSON file.
            # `restore_wrangler_config` puts the committed Wrangler configuration back in the
            # checkout; the destination is unlinked first, not followed, because the project
            # may have left a link there.
            # `platform_wrangler <args>` runs Wrangler as the platform user on that restored
            # configuration, named by its path, for the environment, from the platform's
            # directory, with the platform's secrets loaded in a subshell and its structured
            # output kept for the deployment record.
            cat >> "$BASH_ENV" \<<'ENV'
            nn() { node -p "require(\"/home/circleci/platform/\" + process.argv[1] + \".json\")[process.argv[2]] ?? \"\"" -- "$1" "$2"; }
            restore_wrangler_config() { cp --remove-destination "/home/circleci/platform/wrangler/$(nn nextnode wrangler_config)" ~/project/"$(nn nextnode entry)/$(nn nextnode wrangler_config)"; }
            platform_wrangler() { ( restore_wrangler_config && cd /home/circleci/platform && set -a && . /home/circleci/platform/platform.env && set +a && WRANGLER_OUTPUT_FILE_PATH=/home/circleci/platform/wrangler.ndjson wrangler "$@" --config ~/project/"$(nn nextnode entry)/$(nn nextnode wrangler_config)" --env "$NEXTNODE_ENVIRONMENT" --env-file /home/circleci/platform/empty.env ); }
            ENV
  platform-tools:
    description: Install the Pulumi CLI and the Cloudflare provider plugin into the platform user's home, at the versions the platform package's lockfile names, from the cache when they are unchanged.
    steps:
      - run:
          name: Name the Pulumi versions
          # The CLI and the plugin are released with their SDKs under one version, so a
          # bump of the SDKs in the platform package is a bump of the tools.
          command: |
            lock=/home/circleci/platform/infrastructure/platform/package-lock.json
            version() { node -p "require(process.argv[1]).packages['node_modules/' + process.argv[2]].version" -- "$lock" "$1" | grep -xE '[0-9]+\.[0-9]+\.[0-9]+'; }
            pulumi=$(version @pulumi/pulumi) && cloudflare=$(version @pulumi/cloudflare) || { echo "the lockfile names no release version for the Pulumi SDKs"; exit 1; }
            printf 'PULUMI=%s\nCLOUDFLARE=%s\n' "$pulumi" "$cloudflare" | tee /tmp/tools.txt
      - restore_cache:
          keys:
            - tools-{{ checksum "/tmp/tools.txt" }}
      - run:
          name: Install Pulumi, unless cached
          command: |
            cat >> "$BASH_ENV" \<<'ENV'
            export PATH=$HOME/.platform/pulumi:$PATH
            export PULUMI_HOME=$HOME/.platform/pulumi-home PULUMI_SKIP_UPDATE_CHECK=true
            ENV
            . "$BASH_ENV"
            [ -x ~/.platform/pulumi/pulumi ] && exit 0
            . /tmp/tools.txt
            : "${PULUMI:?}" "${CLOUDFLARE:?}"
            mkdir -p ~/.platform
            # The CLI archive carries a host for every language; only Node's is extracted.
            curl -fsSL --retry 3 "https://github.com/pulumi/pulumi/releases/download/v$PULUMI/pulumi-v$PULUMI-linux-x64.tar.gz" | tar -xz -C ~/.platform pulumi/pulumi pulumi/pulumi-language-nodejs pulumi/pulumi-resource-pulumi-nodejs
            pulumi plugin install resource cloudflare "$CLOUDFLARE"
      - save_cache:
          key: tools-{{ checksum "/tmp/tools.txt" }}
          paths: [~/.platform]
  install-pnpm:
    description: Install the pnpm version pinned in the project's package.json.
    steps:
      - run:
          name: Install the pnpm pinned in package.json
          command: |
            pin=$(node -p "require('./package.json').packageManager ?? ''")
            # A version, with an optional integrity hash. Not a URL, a tag or a path.
            [[ $pin =~ ^pnpm@[0-9]+\.[0-9]+\.[0-9]+(\+sha[0-9]+\.[0-9a-f]+)?$ ]] || { echo "package.json must pin pnpm as pnpm@<version> in packageManager, got '$pin'"; exit 1; }
            sudo npm install --global --no-fund --no-audit "$pin"
            # The store layout follows the pnpm version, so the store cache is keyed by it too.
            echo "$pin" > /tmp/pnpm.txt
  pnpm-store:
    description: Restore the pnpm store of this job kind, pnpm version and lockfile, so the project's install links instead of downloading. A job kind restores only what the same kind saved, so a branch never seeds a deployment's install.
    parameters:
      kind:
        type: enum
        enum: [checks, deploy]
    steps:
      - restore_cache:
          keys:
            - pnpm-<< parameters.kind >>-{{ checksum "/tmp/pnpm.txt" }}-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-<< parameters.kind >>-{{ checksum "/tmp/pnpm.txt" }}-
  pnpm-install:
    description: Install the project's dependencies from the frozen lockfile, as the project user, and save the store under this job kind and lockfile's key.
    parameters:
      kind:
        type: enum
        enum: [checks, deploy]
    steps:
      - project-run:
          command: pnpm install --frozen-lockfile
      - project-run:
          # A store restored from an older lockfile keeps every package it ever held. The
          # prune is paid on every run, a scan of the store, for a store that stays small.
          command: pnpm store prune
      - save_cache:
          key: pnpm-<< parameters.kind >>-{{ checksum "/tmp/pnpm.txt" }}-{{ checksum "pnpm-lock.yaml" }}
          paths: [~/.pnpm-store]
  isolate-project:
    description: Create the project user, hand it the checkout, and end root access. Sudo then only becomes that user.
    steps:
      - run:
          name: Create the project user and end root access
          command: |
            sudo useradd --create-home --gid circleci --shell /bin/bash project
            # A hard link to a file of the platform would be a plain file of the checkout. The
            # kernel refuses one to a file the user cannot read only with this setting.
            [ "$(cat /proc/sys/fs/protected_hardlinks)" = 1 ] || { echo "fs.protected_hardlinks is off: the project could hard-link the platform's files"; exit 1; }
            sudo chmod -R g+w .
            # The pnpm store is the platform user's, restored from the cache; the project user adds to it.
            mkdir -p ~/.pnpm-store && chmod -R g+ws ~/.pnpm-store
            echo 'circleci ALL=(project) NOPASSWD:SETENV: ALL' | sudo tee /etc/sudoers.d/60-project > /dev/null
            sudo visudo -cf /etc/sudoers.d/60-project
            sudo rm /etc/sudoers.d/50-circleci
            if sudo -n true 2> /dev/null; then echo "root access is still available"; exit 1; fi
            echo "root access ended, project commands run as $(sudo -nu project id -un)"
            # Git runs what the repository configures (hooks, core.fsmonitor), and Wrangler
            # calls git for version metadata. The platform user has no further use for git,
            # so its git finds no repository from here on.
            echo 'export GIT_DIR=/nonexistent' >> "$BASH_ENV"
  end-project:
    description: End every process of the project user, so that nothing of the project runs while the platform reads the checkout.
    steps:
      - run:
          name: End the project's processes
          # A dependency may leave a process behind. Signalled as the project user, which
          # may signal every process of its own; the check runs as the platform user.
          command: |
            sudo -nu project kill -9 -1 2> /dev/null || true
            if pgrep -u project > /dev/null; then echo "processes of the project user survive:"; ps -u project -o pid,cmd; exit 1; fi
  forget-job-token:
    description: Remove the OIDC tokens from every later step, once the job has no further use for them.
    steps:
      - run:
          name: Forget the job tokens
          # Every later step sources this file first. CircleCI puts several tokens in the
          # environment under names it chooses, so they go by their common prefix.
          # Rewritten in place, from a variable: no second file in the shared directory.
          command: |
            kept=$(cat "$BASH_ENV")
            printf 'unset ${!CIRCLE_OIDC_TOKEN@}\n%s\n' "$kept" > "$BASH_ENV"
  project-run:
    description: Run a project command as the project user, in an environment built from a list, with the application's secrets.
    parameters:
      step:
        type: string
        default: ""
      command:
        type: string
    steps:
      - run:
          name: <<# parameters.step >><< parameters.step >><</ parameters.step >><<^ parameters.step >><< parameters.command >><</ parameters.step >>
          # Nothing is inherited: the environment holds the names listed here and nothing
          # else, so a variable CircleCI or a platform step adds never reaches the project.
          # The values of the kept names are not secret.
          # exec: no process the project user could read ever held the tokens.
          # umask: the platform user, same group, can read and write what the project builds.
          command: |
            kept=(PATH=/usr/local/bin:/usr/bin:/bin HOME=/home/project CI=true npm_config_store_dir=/home/circleci/.pnpm-store)
            for name in NEXTNODE_ENVIRONMENT CIRCLE_BRANCH CIRCLE_SHA1 CIRCLE_BUILD_URL CIRCLE_PROJECT_REPONAME; do [ -z "${!name:-}" ] || kept+=("$name=${!name}"); done
            exec env -i "${kept[@]}" sudo -nE -u project bash -eo pipefail -c 'umask 002; set -a; [ -f ~/app.env ] && . ~/app.env; set +a; << parameters.command >>'

jobs:
  checks:
    executor: node
    steps:
      - checkout
      - install-pnpm
      - pnpm-store:
          kind: checks
      - isolate-project
      - pnpm-install:
          kind: checks
      - project-run:
          command: pnpm lint
      - project-run:
          command: pnpm format:check
      - project-run:
          command: pnpm type-check
      - project-run:
          command: pnpm run --if-present test

  deploy:
    parameters:
      environment:
        type: enum
        enum: [development, production]
    executor: node
    environment:
      <<: *canary
      NEXTNODE_ENVIRONMENT: << parameters.environment >>
      # Identifiers, not secrets. The vault identity accepts only tokens issued for
      # the main ref of a repository of the organization.
      INFISICAL_IDENTITY_ID: 17af2913-5649-4771-b149-aa9bf50ff39d
      INFISICAL_PLATFORM_PROJECT_ID: 721a5f71-3801-40e2-a06d-a4a9b431e1c7
      NEXTNODE_STATE_BUCKET: nextnode-state
    steps:
      - checkout
      - platform-package
      - read-toml
      - platform-tools
      - install-pnpm
      - pnpm-store:
          kind: deploy
      - isolate-project
      - run:
          name: Fetch the secrets of << parameters.environment >>
          command: |
            : "${CIRCLE_OIDC_TOKEN_V2:?this job needs the OIDC token}"
            : "${INFISICAL_IDENTITY_ID:?}" "${INFISICAL_PLATFORM_PROJECT_ID:?}"
            token=$(infisical login --method=oidc-auth --machine-identity-id="$INFISICAL_IDENTITY_ID" --jwt="$CIRCLE_OIDC_TOKEN_V2" --plain --silent)
            # The vault's JSON export becomes a file of shell exports; the names are logged, the values never.
            export_project() { infisical export --token "$token" --projectId "$1" --env "$2" --format json --silent | node /home/circleci/platform/infrastructure/platform/env-file.ts; }
            # The platform project has a single environment: one account serves every
            # deployment environment. Its secrets stay with the platform user.
            echo -n "platform: "; (umask 077; export_project "$INFISICAL_PLATFORM_PROJECT_ID" main > /home/circleci/platform/platform.env)
            # The application project is the one named after the repository. It carries the
            # per-environment split, and its secrets go to the project user, in a file only
            # that user reads.
            application=$(INFISICAL_TOKEN=$token node /home/circleci/platform/infrastructure/platform/vault-project.ts --name "$(nn nextnode project)")
            echo -n "application ($application): "; export_project "$application" "$NEXTNODE_ENVIRONMENT" | sudo -nu project sh -c 'umask 077; cat > /home/project/app.env'
      - forget-job-token
      - pnpm-install:
          kind: deploy
      - project-run:
          command: pnpm build
      - project-run:
          step: Bundle the Worker
          # Wrangler's bundler follows every import of the project's code, so it runs as
          # the project user: what it can read is what the project can read. The upload
          # takes the bundle as it is. A Worker of static assets only has nothing to bundle.
          command: 'spec=/home/circleci/platform/nextnode.json; entry=$(node -p "require(\"$spec\").entry"); bundle=$(node -p "require(\"$spec\").bundle"); config=$(node -p "require(\"$spec\").wrangler_config"); if [ -z "$bundle" ]; then echo "No entry point in $config: static assets only, nothing to bundle."; exit 0; fi; rm -rf "$entry/${bundle%/*}"; /home/circleci/platform/infrastructure/platform/node_modules/.bin/wrangler deploy --dry-run --outdir "$entry/${bundle%/*}" --config "$entry/$config" --env "$NEXTNODE_ENVIRONMENT" && [ -f "$entry/$bundle" ]'
      - project-run:
          step: Migrations
          # The project's own command, run as the project user: the one value of the
          # project a shell evaluates. The project's shell has no `nn`, it reads the JSON itself.
          command: migrate=$(node -p "require(\"/home/circleci/platform/nextnode.json\").migrate"); if [ -n "$migrate" ]; then echo "+ $migrate"; eval "$migrate"; else echo "No migrate command in nextnode.toml, nothing to run."; fi
      - end-project
      - run:
          name: Seal the checkout
          # Wrangler reads and uploads what the project left in the checkout, as the
          # platform user: a link that resolves outside it is refused before Wrangler runs.
          command: node /home/circleci/platform/infrastructure/platform/sealed.ts --root ~/project
      - run:
          name: Deploy
          # Development replaces what serves, and so does a production Worker's first
          # deployment, when nothing serves yet. Every other production deployment is a
          # version without traffic, promoted by a later step. Wrangler runs as the
          # platform user on the committed configuration and uploads the bundle the
          # project user built, without bundling: it reads the configuration's paths and
          # the sealed checkout, never an import. What it did is read from its structured output.
          command: |
            rm -f /home/circleci/platform/wrangler.ndjson
            bundle=$(nn nextnode bundle); script=()
            [ -z "$bundle" ] || script=(--no-bundle ~/project/"$(nn nextnode entry)/$bundle")
            if [ "$NEXTNODE_ENVIRONMENT" = development ]; then
              platform_wrangler deploy "${script[@]}"
            elif listed=$(platform_wrangler versions list 2>&1); then
              platform_wrangler versions upload --message "$CIRCLE_SHA1" "${script[@]}"
            elif printf '%s\n' "$listed" | grep -q "code: 10007"; then
              # 10007 is Cloudflare's code for a Worker that does not exist. Any other error stops here.
              echo "First deployment of this Worker: nothing serves yet, deployed directly."
              platform_wrangler deploy "${script[@]}"
            else
              printf '%s\n' "$listed"; exit 1
            fi
            node /home/circleci/platform/infrastructure/platform/deployed.ts --wrangler-output /home/circleci/platform/wrangler.ndjson --domain "$(nn nextnode domain)" > /home/circleci/platform/deploy.json
            cat /home/circleci/platform/deploy.json
      - run:
          name: Resources
          # Runs once the Worker of this deployment is uploaded and before the smoke
          # request: a custom domain attaches to a Worker that exists, and a domain that
          # serves is never touched before its replacement is there. The driver prints the
          # stack outputs as JSON, kept for the Worker bindings.
          command: |
            cd /home/circleci/platform/infrastructure/platform
            set -a; . /home/circleci/platform/platform.env; set +a
            rm -rf /home/circleci/platform/pulumi && mkdir /home/circleci/platform/pulumi
            node deploy.ts --spec /home/circleci/platform/nextnode.json --work /home/circleci/platform/pulumi > /home/circleci/platform/resources.json
            echo "outputs: $(cat /home/circleci/platform/resources.json)"
      - run:
          name: Smoke
          command: |
            url="$(nn deploy url)$(nn nextnode health)"
            curl -fsS --retry 5 --retry-delay 3 --retry-all-errors -o /dev/null -w "%{http_code} $url\n" "$url"
      - run:
          name: Promote the version to all traffic
          command: |
            version=$(nn deploy version)
            [ -n "$version" ] || { echo "Deployed directly, already serving."; exit 0; }
            platform_wrangler versions deploy "$version@100%" --message "$CIRCLE_SHA1" --yes

  probe:
    # The boundary's regression test. Every step is an attack: the project's, run
    # through the same entry point as a project command, or a change to what the
    # platform reads, run as the platform user on a copy of the checkout. A step
    # passes only when the attack fails. No vault login: the files it attacks stand
    # in for the real ones, written the way the vault step writes them.
    executor: node
    environment:
      <<: *canary
      # Every project declares production, so the job never halts with zero probes run.
      NEXTNODE_ENVIRONMENT: production
    steps:
      - run:
          name: The probe job runs on the canary only
          command: '[ "$CIRCLE_PROJECT_ID" = "$NEXTNODE_CANARY_PROJECT_ID" ]'
      - checkout
      - platform-package
      - read-toml
      - platform-tools
      - run:
          name: "Probe: a second Wrangler configuration, a build command, a route and a nameless Worker are refused"
          # Each attack on a fresh copy of the checkout. A refusal is matched on its
          # reason, so a crash of the reader does not pass for a refusal, and an
          # accepted attack ends the step at once: in an && list, set -e would let it pass.
          command: |
            entry=$(nn nextnode entry); config=$(nn nextnode wrangler_config)
            case "$config" in *.json|*.jsonc) ;; *) echo "this probe edits a JSON configuration, the canary commits $config"; exit 1;; esac
            fresh() { work=$(mktemp -d) && cp -r ~/project/. "$work" && cd "$work"; }
            refused() {
              if out=$(node /home/circleci/platform/infrastructure/platform/read.ts --repository "$CIRCLE_PROJECT_REPONAME" --environment "$NEXTNODE_ENVIRONMENT" --platform "$work/platform" 2>&1); then echo "accepted: $1"; exit 1; fi
              printf '%s\n' "$out" | grep -q "$2" || { echo "the read step failed on $1 for another reason:"; printf '%s\n' "$out"; exit 1; }
              echo "refused: $1"
            }
            # Rewrites the committed configuration through a parser, merging environment sections.
            with() { node -e 'const fs = require("node:fs"), jsonc = require("/home/circleci/platform/infrastructure/platform/node_modules/jsonc-parser"); const file = process.argv[1]; const config = jsonc.parse(fs.readFileSync(file, "utf8"), [], { allowTrailingComma: true }); const extra = JSON.parse(process.argv[2]); const env = Object.fromEntries(Object.entries(extra.env ?? {}).map(([name, section]) => [name, { ...config.env?.[name], ...section }])); fs.writeFileSync(file, JSON.stringify({ ...config, ...extra, env: { ...config.env, ...env } }))' -- "$entry/$config" "$1"; }
            fresh; touch "$entry/wrangler.toml"; refused "a second Wrangler configuration" "expected one Wrangler configuration"
            fresh; with '{ "build": { "command": "true" } }'; refused "a build command" "declares a build command"
            fresh; with "{ \"env\": { \"$NEXTNODE_ENVIRONMENT\": { \"build\": { \"command\": \"true\" } } } }"; refused "a build command of the environment" "declares a build command"
            fresh; with '{ "routes": ["probe.example/*"] }'; refused "a route" "declares routes"
            fresh; with "{ \"env\": { \"$NEXTNODE_ENVIRONMENT\": { \"route\": \"probe.example/*\" } } }"; refused "a route of the environment" "declares routes"
            fresh; with "{ \"name\": null, \"env\": { \"$NEXTNODE_ENVIRONMENT\": { \"name\": null } } }"; refused "a Worker without a name" "declares no name"
            fresh; printf '[deploy]\nentry = "../%s"\n[environments.production]\ndomain = "probe.example"\n' "$entry" > nextnode.toml; refused "an entry outside the repository" "must be a directory of the repository"
            fresh; printf '[deploy]\nentry = "probe-missing"\n[environments.production]\ndomain = "probe.example"\n' > nextnode.toml; refused "an entry that does not exist" "must be a directory of the repository"
            fresh; with '{ "assets": { "directory": "/home/circleci/platform" } }'; refused "an assets directory outside the repository" "assets.directory leaves the repository"
            fresh; with '{ "main": "../../../platform/platform.env" }'; refused "an entry point outside the repository" "main leaves the repository"
            fresh; with "{ \"env\": { \"$NEXTNODE_ENVIRONMENT\": { \"base_dir\": \"../..\" } } }"; refused "a module root of the environment outside the repository" "base_dir leaves the repository"
            fresh; with '{ "text_blobs": { "SECRET": "/home/circleci/platform/platform.env" } }'; refused "a text blob outside the repository" "text_blobs.SECRET leaves the repository"
      - run:
          name: "Probe: a value read from a platform file stays text"
          command: |
            node -e 'require("node:fs").writeFileSync("/home/circleci/platform/literal.json", JSON.stringify({ value: "$(touch /tmp/probe-evaluated) `touch /tmp/probe-evaluated`; touch /tmp/probe-evaluated" }))'
            [ "$(nn literal value)" = '$(touch /tmp/probe-evaluated) `touch /tmp/probe-evaluated`; touch /tmp/probe-evaluated' ] && [ ! -e /tmp/probe-evaluated ]
      - isolate-project
      - run:
          name: Stand in for the vault step
          command: |
            (umask 077; echo 'export PLATFORM_PROBE=platform' > /home/circleci/platform/platform.env)
            echo 'export APP_PROBE=application' | sudo -nu project sh -c 'umask 077; cat > /home/project/app.env'
            # Loaded the way the deployment steps load it: nothing of it may reach a later step.
            set -a; . /home/circleci/platform/platform.env; set +a
            # A variable of the platform steps, exported to every later one: the project must not see it.
            echo 'export PLATFORM_STEP_PROBE=platform' >> "$BASH_ENV"
            # A platform process that outlives this step with the token in its environment,
            # the target of the process probe. The step itself holds the token too.
            setsid sleep 1800 > /dev/null 2>&1 &
            holder=$!
            for pid in $$ "$holder"; do grep -Eqsaz "^CIRCLE_OIDC_TOKEN[A-Z0-9_]*=" "/proc/$pid/environ" || { echo "the platform process $pid does not hold the token: the process probe would prove nothing"; exit 1; }; done
            # Project shells have no BASH_ENV: what the probes need reaches them through a platform file.
            agents=$(command -v circleci circleci-agent | tr '\n' ' '); [ -n "$agents" ] || { echo "no agent binary found: the mint probe would prove nothing"; exit 1; }
            node -e 'require("node:fs").writeFileSync("/home/circleci/platform/probe.json", JSON.stringify({ bash_env: process.env.BASH_ENV, holder: process.argv[1], agents: process.argv[2] }))' -- "$holder" "$agents"
            stat -c '%U:%G %a %n' "$BASH_ENV" /home/circleci/platform /home/circleci/platform/platform.env
      - project-run:
          step: "Probe: the project finds no job token in its environment while the platform steps still hold them"
          # Anchored on a name: sudo records the command, pattern included, in SUDO_COMMAND.
          command: 'found=$(env | grep -E "^CIRCLE_OIDC_TOKEN[A-Z0-9_]*=|eyJ[A-Za-z0-9_-]+\.eyJ" | cut -d= -f1 || true); [ -z "$found" ] || { echo "a token-shaped value in: $found"; exit 1; }'
      - forget-job-token
      - run:
          name: "Probe: the job tokens are gone from the platform steps"
          command: '[ -z "${!CIRCLE_OIDC_TOKEN@}" ]'
      - project-run:
          step: "Probe: the project receives its own secrets and nothing of the platform's environment"
          command: '[ "$APP_PROBE" = application ] && [ -z "${PLATFORM_PROBE:-}" ] && [ -z "${PLATFORM_STEP_PROBE:-}" ]'
      - project-run:
          step: "Probe: the project's environment holds only the listed names"
          # What sudo and bash add to the list is named here; anything else is a leak.
          command: 'extra=$(env | cut -d= -f1 | grep -vxE "PATH|HOME|CI|npm_config_store_dir|NEXTNODE_ENVIRONMENT|CIRCLE_(BRANCH|SHA1|BUILD_URL|PROJECT_REPONAME)|APP_PROBE|SUDO_(COMMAND|USER|UID|GID|HOME)|USER|LOGNAME|MAIL|SHELL|SHLVL|PWD|OLDPWD|TERM|LANG|LC_[A-Z]+|_" || true); [ -z "$extra" ] || { echo "not in the list: $extra"; exit 1; }'
      - project-run:
          step: "Probe: the project finds no job token in the platform process that holds one, nor in any process it can inspect"
          command: 'holder=$(node -p "require(\"/home/circleci/platform/probe.json\").holder"); [ -d "/proc/$holder" ] || { echo "the holder process is gone"; exit 1; }; if cat "/proc/$holder/environ" > /dev/null 2>&1; then echo "the project can read the environment of platform process $holder"; exit 1; fi; found=$(grep -Elsaz "^CIRCLE_OIDC_TOKEN[A-Z0-9_]*=|eyJ[A-Za-z0-9_-]+\.eyJ" /proc/[0-9]*/environ || true); [ -z "$found" ] || { echo "a token-shaped value in: $found"; exit 1; }'
      - project-run:
          step: "Probe: no file the project can read holds a token"
          command: 'file=$(node -p "require(\"/home/circleci/platform/probe.json\").bash_env"); [ -n "$file" ]; found=$(grep -Elrs "eyJ[A-Za-z0-9_-]+\.eyJ" /home/circleci/platform "$file" || true); [ -z "$found" ] || { echo "a token-shaped value in: $found"; exit 1; }'
      - project-run:
          step: "Probe: the project cannot have the agent mint a job token"
          # The agent serves `circleci run oidc get` to the job's steps. Called from the
          # project's environment, every agent binary must fail or print no token.
          command: 'agents=$(node -p "require(\"/home/circleci/platform/probe.json\").agents"); [ -n "$agents" ]; for agent in $agents; do out=$("$agent" run oidc get 2>&1 || true); if printf "%s" "$out" | grep -Eq "eyJ[A-Za-z0-9_-]+\.eyJ"; then echo "$agent minted a token for the project"; exit 1; fi; echo "refused: $agent"; done'
      - project-run:
          step: "Probe: the project cannot read the platform's secrets"
          command: '! cat /home/circleci/platform/platform.env'
      - project-run:
          step: "Probe: the project cannot write where the platform keeps its files or loads code"
          command: 'for d in /home/circleci /home/circleci/.platform /home/circleci/.platform/pulumi /home/circleci/.platform/pulumi-home /home/circleci/platform /home/circleci/platform/infrastructure /home/circleci/platform/infrastructure/platform/node_modules; do [ -d "$d" ] || { echo "missing: $d"; exit 1; }; if touch "$d/probe" 2> /dev/null; then echo "writable: $d"; exit 1; fi; done'
      - project-run:
          step: "Probe: the project cannot append to the file every platform step sources"
          command: 'file=$(node -p "require(\"/home/circleci/platform/probe.json\").bash_env"); [ -n "$file" ] && ! sh -c "echo probe >> $file"'
      - run:
          name: "Probe: the sourced file is the platform user's and holds only the pipeline's text"
          command: '[ "$(stat -c %U "$BASH_ENV")" = circleci ] && [ -z "$(find "$BASH_ENV" -perm /022)" ] && ! grep -Eq "^probe$|PLATFORM_PROBE=|eyJ[A-Za-z0-9_-]+\.eyJ" "$BASH_ENV"'
      - project-run:
          step: "Probe: the project cannot become another user"
          command: '! sudo -n true && ! sudo -nu circleci true'
      - project-run:
          step: "Probe: the project leaves a process behind"
          command: 'setsid sleep 1800 > /dev/null 2>&1 & sleep 1; pgrep -u project -x sleep > /dev/null'
      - end-project
      - run:
          name: "Probe: the platform ended it, with every other process of the project"
          command: '! pgrep -u project'
      - project-run:
          step: "Probe: the project cannot hard-link a file of the platform into the checkout"
          command: 'entry=$(node -p "require(\"/home/circleci/platform/nextnode.json\").entry"); if ln /home/circleci/platform/platform.env "$entry/probe-hard" 2> /dev/null; then echo "hard-linked the platform secrets into the checkout"; exit 1; fi; [ ! -e "$entry/probe-hard" ]'
      - project-run:
          step: "Probe: the project links a file of the platform, one of its own process, a file the platform writes later, and one of its own, into the checkout"
          # probe-later dangles now: its target is a file the deployment writes before Wrangler reads the checkout.
          command: 'entry=$(node -p "require(\"/home/circleci/platform/nextnode.json\").entry"); ln -s /home/circleci/platform/platform.env "$entry/probe-secret" && ln -s /proc/self/environ "$entry/probe-environ" && ln -s /home/circleci/platform/wrangler.ndjson "$entry/probe-later" && ln -s . "$entry/probe-inside"'
      - run:
          name: "Probe: the seal refuses the three links that leave the checkout, names them, and keeps the fourth"
          command: |
            if out=$(node /home/circleci/platform/infrastructure/platform/sealed.ts --root ~/project 2>&1); then echo "accepted a checkout with links outside it"; exit 1; fi
            for link in probe-secret probe-environ probe-later; do printf '%s\n' "$out" | grep -q "$link" || { echo "not named: $link"; printf '%s\n' "$out"; exit 1; }; done
            ! printf '%s\n' "$out" | grep -q probe-inside
            entry=$(nn nextnode entry); rm ~/project/"$entry"/probe-secret ~/project/"$entry"/probe-environ ~/project/"$entry"/probe-later
            node /home/circleci/platform/infrastructure/platform/sealed.ts --root ~/project
      - run:
          name: "Probe: the upload takes the bundle as it is, so an import of a platform file reaches nothing"
          # The bundle is the project's: its entry point imports the platform's secrets and
          # the committed configuration asks for such files as text modules. The positive
          # control bundles it the way the platform never does, and the secret is in the output.
          command: |
            entry=$(nn nextnode entry); config=$(nn nextnode wrangler_config)
            work=$(mktemp -d) && cp -r ~/project/. "$work"
            node -e 'const fs = require("node:fs"), jsonc = require("/home/circleci/platform/infrastructure/platform/node_modules/jsonc-parser"); const file = process.argv[1]; const config = jsonc.parse(fs.readFileSync(file, "utf8"), [], { allowTrailingComma: true }); config.find_additional_modules = true; config.rules = [{ type: "Text", globs: ["**/*.env"] }]; fs.writeFileSync(file, JSON.stringify(config))' "$work/$entry/$config"
            mkdir -p "$work/$entry/.nextnode"
            printf 'import leak from "/home/circleci/platform/platform.env";\nexport default { fetch() { return new Response(leak); } };\n' > "$work/$entry/.nextnode/index.js"
            upload() { ( cd /home/circleci/platform && set -a && . /home/circleci/platform/platform.env && set +a && wrangler deploy --dry-run "$@" --config "$work/$entry/$config" --env "$NEXTNODE_ENVIRONMENT" --env-file /home/circleci/platform/empty.env "$work/$entry/.nextnode/index.js" > /dev/null 2>&1 ); }
            upload --outdir "$work/control" && grep -rq "PLATFORM_PROBE=platform" "$work/control" || { echo "the positive control did not bundle the platform file: the probe would prove nothing"; exit 1; }
            upload --no-bundle --outdir "$work/upload"
            if grep -rq "PLATFORM_PROBE=platform" "$work/upload"; then echo "the upload carries the platform's secrets"; exit 1; fi
      - project-run:
          step: "Probe: the project replaces the Wrangler configuration after the platform read it"
          command: 'entry=$(node -p "require(\"/home/circleci/platform/nextnode.json\").entry"); config=$(node -p "require(\"/home/circleci/platform/nextnode.json\").wrangler_config"); echo "{ \"build\": { \"command\": \"true\" } }" > "$entry/$config.project" && mv "$entry/$config" "$entry/$config.committed" && ln -s "$config.project" "$entry/$config"'
      - run:
          name: "Probe: Wrangler receives the committed configuration, whatever the project left in its place"
          command: |
            restore_wrangler_config
            file=~/project/"$(nn nextnode entry)/$(nn nextnode wrangler_config)"
            [ ! -L "$file" ] && cmp "$file" "/home/circleci/platform/wrangler/$(nn nextnode wrangler_config)"
      - project-run:
          step: "Probe: the project configures git to run a command, and its own git runs it"
          # The positive control: the hook runs for the project's git, so the platform's
          # git is what keeps it from running, not a hook that never fires.
          command: 'printf "#!/bin/sh\ntouch /tmp/probe-fsmonitor-ran\n" > /tmp/probe-fsmonitor.sh && chmod +x /tmp/probe-fsmonitor.sh && git config --global --add safe.directory "*" && git config core.fsmonitor /tmp/probe-fsmonitor.sh && git status > /dev/null && [ -e /tmp/probe-fsmonitor-ran ] && rm /tmp/probe-fsmonitor-ran'
      - run:
          name: "Probe: the platform's git finds no repository, so the configured command never runs"
          command: |
            cd "$(nn nextnode entry)"
            if git status > /dev/null 2>&1; then echo "the platform's git found a repository"; exit 1; fi
            [ ! -e /tmp/probe-fsmonitor-ran ]

workflows:
  pipeline:
    unless: << pipeline.parameters.probe >>
    jobs:
      - checks
      - deploy:
          name: deploy-dev
          environment: development
          requires: [checks]
          filters: &main
            branches:
              only: main
      - hold:
          type: approval
          requires: [deploy-dev]
          filters: *main
      - deploy:
          name: deploy-prod
          environment: production
          requires: [hold]
          filters: *main
  probes:
    when: << pipeline.parameters.probe >>
    jobs:
      - probe
